services:
  # --- PHP-FPM application ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbooks_app
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - openbooks

  # --- Nginx web server ---
  nginx:
    image: nginx:1.27-alpine
    container_name: openbooks_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - openbooks

  # --- MySQL 8.0 ---
  db:
    image: mysql:8.0
    container_name: openbooks_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-openbooks_sg}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${DB_USERNAME:-openbooks}
      MYSQL_PASSWORD: ${DB_PASSWORD:-openbooks_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openbooks

  # --- phpMyAdmin (dev convenience) ---
  phpmyadmin:
    image: phpmyadmin:5
    container_name: openbooks_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - openbooks

volumes:
  db_data:
    driver: local

networks:
  openbooks:
    driver: bridge
