<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBooks SG — API Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui-dark.css">
  <style>
    body { margin: 0; background: #1a1a2e; }
    .topbar { display: none; }
    .swagger-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .swagger-ui .info .title { color: #e0e0e0; }
    .header-bar { background: #16213e; padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; }
    .header-bar h1 { color: #e94560; font-size: 20px; margin: 0; font-weight: 600; }
    .header-bar span { color: #8892b0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>OpenBooks SG</h1>
    <span>API Documentation v1.0.0</span>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: './openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
      tryItOutEnabled: true,
      persistAuthorization: true,
      syntaxHighlight: { theme: 'agate' },
    });
  </script>
</body>
</html>
