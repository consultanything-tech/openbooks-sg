<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - OpenBooks SG</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 2rem; max-width: 480px; }
        .icon {
            width: 96px; height: 96px; margin: 0 auto 2rem;
            background: rgba(79, 70, 229, 0.15);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
        p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
        button {
            background: #4f46e5; color: #fff; border: none;
            padding: 0.75rem 2rem; border-radius: 12px;
            font-family: inherit; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
        .badge {
            display: inline-block; margin-top: 2rem;
            font-size: 0.7rem; color: #64748b;
            background: rgba(255,255,255,0.05);
            padding: 0.35rem 0.85rem; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128268;</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. OpenBooks SG requires an active connection to sync your accounting data.</p>
        <button onclick="window.location.reload()">Try Again</button>
        <div class="badge">OpenBooks SG &mdash; Open Source Accounting</div>
    </div>
</body>
</html>
